<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OCEVIA Surf House - Premium Surf Experience in Morocco">
<meta name="theme-color" content="#000000">
<title>OCEVIA Surf House PRO</title>

<script src="https://js.stripe.com/v3/"></script>

<style>
:root {
  --primary: #1e90ff;
  --dark: #000;
  --light: #fff;
  --bg: #0a0a0a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--dark);
  color: var(--light);
  line-height: 1.6;
}

nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  z-index: 1000;
  border-bottom: 1px solid rgba(30, 144, 255, 0.2);
}

nav h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}

.nav-actions {
  display: flex;
  gap: 15px;
  align-items: center;
}

.nav-actions button {
  background: transparent;
  border: none;
  color: var(--light);
  cursor: pointer;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 5px;
  transition: all 0.3s;
}

.nav-actions button:hover {
  background: rgba(30, 144, 255, 0.2);
}

.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), 
              url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80') center/cover;
  margin-top: 60px;
  flex-direction: column;
}

.hero h1 {
  font-size: clamp(32px, 8vw, 60px);
  margin-bottom: 10px;
  font-weight: 700;
}

.hero p {
  font-size: 18px;
  margin-bottom: 30px;
  color: #ccc;
}

section {
  padding: 80px 20px;
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}

section h2 {
  font-size: 36px;
  margin-bottom: 50px;
  color: var(--primary);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
  margin-bottom: 50px;
}

.card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(30, 144, 255, 0.2);
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.card:hover {
  border-color: var(--primary);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(30, 144, 255, 0.1);
}

.card h3 {
  margin-top: 0;
  color: var(--primary);
}

.card p {
  font-size: 24px;
  font-weight: 600;
  margin: 15px 0;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px 15px;
  margin: 8px 0;
  border: 1px solid rgba(30, 144, 255, 0.3);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--light);
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px rgba(30, 144, 255, 0.3);
  background: rgba(255, 255, 255, 0.08);
}

input::placeholder,
textarea::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

button {
  padding: 12px 24px;
  border: none;
  background: var(--primary);
  color: var(--light);
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s;
  margin: 10px 5px;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(30, 144, 255, 0.4);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.form-group {
  max-width: 450px;
  margin: 0 auto;
  text-align: left;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  border-left: 4px solid var(--primary);
}

.result.success {
  background: rgba(34, 197, 94, 0.1);
  border-left-color: #22c55e;
  color: #86efac;
}

.result.error {
  background: rgba(239, 68, 68, 0.1);
  border-left-color: #ef4444;
  color: #fca5a5;
}

.chat {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 320px;
  background: rgba(10, 10, 10, 0.95);
  border: 1px solid rgba(30, 144, 255, 0.3);
  display: none;
  flex-direction: column;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  z-index: 999;
}

.chat.active {
  display: flex;
}

.chat-header {
  background: var(--primary);
  padding: 15px;
  font-weight: 600;
}

.chat-body {
  height: 250px;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-body p {
  margin: 0;
  padding: 10px;
  border-radius: 8px;
  max-width: 90%;
  word-wrap: break-word;
}

.chat-body .user {
  background: rgba(30, 144, 255, 0.2);
  align-self: flex-end;
  border-color: var(--primary);
}

.chat-body .ai {
  background: rgba(100, 100, 100, 0.2);
  align-self: flex-start;
}

#msg {
  border-radius: 0 0 15px 15px;
  border-top: 1px solid rgba(30, 144, 255, 0.3);
  margin: 0;
}

.chat-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: var(--light);
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(30, 144, 255, 0.4);
  transition: all 0.3s;
  z-index: 998;
}

.chat-toggle:hover {
  transform: scale(1.1);
}

.loading {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.stat-card {
  background: linear-gradient(135deg, rgba(30, 144, 255, 0.1) 0%, rgba(30, 144, 255, 0.05) 100%);
  padding: 20px;
  border-radius: 10px;
  border: 1px solid rgba(30, 144, 255, 0.2);
}

.stat-card h4 {
  margin: 0 0 10px 0;
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
  text-transform: uppercase;
}

.stat-card .value {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
}

@media (max-width: 768px) {
  nav {
    flex-direction: column;
    gap: 10px;
  }

  .hero {
    margin-top: 100px;
  }

  section {
    padding: 40px 15px;
  }

  .chat {
    width: 280px;
    bottom: 80px;
    right: 10px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<nav>
  <h1>🌊 OCEVIA Surf House</h1>
  <div class="nav-actions">
    <button onclick="handleAuthToggle()"><span id="authText">Login</span></button>
    <button onclick="scrollToBook()">Book</button>
  </div>
</nav>

<div class="hero">
  <div>
    <h1>Surf Experience Morocco</h1>
    <p>Taghazout • Imsouan • Tamraghte</p>
    <button onclick="scrollToBook()" style="background: var(--primary); padding: 15px 30px; font-size: 16px;">Book Now</button>
    <button onclick="scrollToPay()" style="background: transparent; border: 2px solid var(--primary);">Pay Deposit</button>
  </div>
</div>

<section id="booking">
  <h2>Booking System</h2>
  <div class="form-group">
    <div class="card">
      <input id="name" placeholder="Full Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <select id="room" required>
        <option value="">Select Room Type</option>
        <option value="Surf Loft">Surf Loft - €90/day</option>
        <option value="Ocean Suite">Ocean Suite - €120/day</option>
        <option value="Villa">Villa - €150/day</option>
      </select>
      <input id="days" type="number" placeholder="Number of Days" min="1" max="90" required>
      <button onclick="book()" style="width: 100%; margin-top: 15px;">Confirm Booking</button>
      <div id="result"></div>
    </div>
  </div>
</section>

<section id="dashboard">
  <h2>Dashboard</h2>
  <div class="stats">
    <div class="stat-card">
      <h4>Total Bookings</h4>
      <div class="value" id="count">0</div>
    </div>
    <div class="stat-card">
      <h4>Revenue</h4>
      <div class="value" id="revenue">€0</div>
    </div>
    <div class="stat-card">
      <h4>Pending Payments</h4>
      <div class="value" id="pending">0</div>
    </div>
  </div>
</section>

<!-- CHAT -->
<div class="chat" id="chat">
  <div class="chat-header">🤖 OCEVIA AI Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <input id="msg" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMsg()">
</div>

<button class="chat-toggle" onclick="toggleChat()">💬</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Initialize Supabase (Client-side only)
const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
const apiBase = import.meta.env.VITE_API_URL || '/api';

let authToken = localStorage.getItem('authToken');

// ===== BOOKING =====
window.book = async function() {
  try {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const room = document.getElementById('room').value;
    const days = parseInt(document.getElementById('days').value);
    const resultEl = document.getElementById('result');

    // Validation
    if (!name || !email || !room || !days) {
      showResult('Fill all fields', 'error');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showResult('Invalid email address', 'error');
      return;
    }

    if (days < 1 || days > 90) {
      showResult('Days must be between 1 and 90', 'error');
      return;
    }

    const response = await fetch(`${apiBase}/bookings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, room, days })
    });

    const data = await response.json();

    if (!response.ok) {
      showResult(data.error || 'Booking failed', 'error');
      return;
    }

    const price = calculatePrice(room, days);
    showResult(`✅ Booking confirmed! Total: €${price}`, 'success');
    
    // Send confirmation email
    await sendBookingEmail(name, email, room, days, price, data.booking.id);
    
    // Load dashboard
    loadDashboard();
    
    // Reset form
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('room').value = '';
    document.getElementById('days').value = '';
  } catch (err) {
    console.error('Booking error:', err);
    showResult('An error occurred. Please try again.', 'error');
  }
};

function calculatePrice(room, days) {
  const prices = { 'Surf Loft': 90, 'Ocean Suite': 120, 'Villa': 150 };
  return (prices[room] || 0) * days;
}

function showResult(msg, type) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = `result ${type}`;
  setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
}

async function sendBookingEmail(name, email, room, days, price, bookingId) {
  try {
    await fetch(`${apiBase}/email/send-booking-confirmation`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, room, days, price, bookingId })
    });
  } catch (err) {
    console.error('Email send error:', err);
  }
}

// ===== DASHBOARD =====
window.loadDashboard = async function() {
  try {
    const response = await fetch(`${apiBase}/bookings`, {
      headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
    });

    if (!response.ok) return;

    const data = await response.json();
    const bookings = data.data || [];

    let total = 0;
    let pending = 0;

    bookings.forEach(b => {
      total += b.price || 0;
      if (b.status === 'pending') pending++;
    });

    document.getElementById('count').textContent = bookings.length;
    document.getElementById('revenue').textContent = '€' + total;
    document.getElementById('pending').textContent = pending;
  } catch (err) {
    console.error('Dashboard error:', err);
  }
};

// ===== STRIPE PAYMENT =====
const stripe = Stripe(import.meta.env.VITE_STRIPE_PUBLIC_KEY);

window.scrollToPay = function() {
  const email = document.getElementById('email').value;
  if (!email) {
    alert('Please enter your email in the booking form');
    return;
  }
  // Payment flow would be implemented here
  alert('Payment integration coming soon');
};

// ===== CHAT =====
window.toggleChat = function() {
  document.getElementById('chat').classList.toggle('active');
};

window.sendMsg = async function() {
  const msgInput = document.getElementById('msg');
  const msg = msgInput.value.trim();
  
  if (!msg) return;

  const chatBody = document.getElementById('chatBody');
  
  // User message
  const userP = document.createElement('p');
  userP.className = 'user';
  userP.textContent = 'You: ' + msg;
  chatBody.appendChild(userP);
  msgInput.value = '';
  chatBody.scrollTop = chatBody.scrollHeight;

  try {
    const response = await fetch(`${apiBase}/chat/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });

    const data = await response.json();

    const aiP = document.createElement('p');
    aiP.className = 'ai';
    aiP.textContent = 'AI: ' + (data.reply || 'Unable to process. Please try again.');
    chatBody.appendChild(aiP);
    chatBody.scrollTop = chatBody.scrollHeight;
  } catch (err) {
    console.error('Chat error:', err);
    const errP = document.createElement('p');
    errP.className = 'ai';
    errP.textContent = 'AI: Sorry, I encountered an error. Please try again.';
    chatBody.appendChild(errP);
  }
};

// ===== SCROLL FUNCTIONS =====
window.scrollToBook = function() {
  document.getElementById('booking').scrollIntoView({ behavior: 'smooth' });
};

window.handleAuthToggle = function() {
  // Simple auth toggle for demo
  alert('Auth system integrated on backend. Login/Register endpoints ready.');
};

// ===== INITIALIZATION =====
loadDashboard();
</script>

</body>
</html>
